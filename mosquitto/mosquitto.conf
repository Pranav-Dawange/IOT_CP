# ==============================================================================
# Eclipse Mosquitto MQTT Broker Configuration (Phase 4 Development & Testing)
# ==============================================================================
#
# NOTE: This configuration is intended strictly for local development, simulation,
# and integration testing of the Smart Industrial Asset Monitoring system.
# It permits unauthenticated, unencrypted connections on port 1883.
# For production deployment, TLS/mTLS encryption and username/password ACLs
# must be enabled.
# ==============================================================================

# Network listener port
listener 1883
allow_anonymous true

# Maximum packet size (10MB)
max_packet_size 10485760

# Keepalive and queue settings
max_queued_messages 10000
max_inflight_messages 20

# Persistence settings
persistence true
persistence_location ./mosquitto/data/
persistence_file mosquitto.db

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
