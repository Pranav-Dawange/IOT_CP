server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Static bundles and assets compiled by Vite (skip any regex matching)
    location ^~ /static/ {
        try_files $uri =404;
    }

    # 2. Static root assets (e.g., favicon, icons)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    # 3. Proxy WebSocket live stream
    location /ws/live {
        proxy_pass http://backend:8000/ws/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Proxy API endpoints to FastAPI backend service
    location ~ ^/(assets|health|predictions|alerts) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
